name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/qdyd4p9t6xoabl95n5o3g/Downloads.bat?rlkey=snr74vv1vr8k5suujugvrhjtm&dl=1" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Verificar RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              Write-Host "RustDesk nao encontrado!"
              exit 1
          }

          Write-Host "=== RustDesk encontrado ==="

          Start-Process $rustdesk
          Start-Sleep -Seconds 15

          Write-Host "=== ID ==="
          & $rustdesk --get-id

          Write-Host "=== Processos ==="
          Get-Process rustdesk -ErrorAction SilentlyContinue

          Write-Host "=== Conexoes RustDesk ==="
          Get-NetTCPConnection |
            Where-Object {$_.OwningProcess -in (Get-Process rustdesk -ErrorAction SilentlyContinue).Id} |
            Format-Table -AutoSize

      - name: Log In To AnyDesk
        run: cmd /c show.bat

      - name: Time Counter
        run: python time.py
