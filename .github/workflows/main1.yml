name: Windows - RustDesk Mobile

on:
  workflow_dispatch:

jobs:
  rustdesk:
    name: Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. PREPARAR AMBIENTE
      # ============================================================

      - name: Prepare Environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " PREPARANDO WINDOWS"
          Write-Host "========================================"

          python -m pip install `
            pyautogui `
            pyperclip `
            psutil `
            --quiet

          New-Item `
            -ItemType Directory `
            -Path "C:\RustDesk" `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "Ambiente preparado."


      # ============================================================
      # 2. BAIXAR RUSTDESK
      # ============================================================

      - name: Download RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " BAIXANDO RUSTDESK 1.2.1"
          Write-Host "========================================"

          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"

          $output = "C:\RustDesk\rustdesk.exe"

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            --retry-all-errors `
            --connect-timeout 30 `
            -o $output `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao baixar RustDesk."
          }

          if (!(Test-Path $output)) {
              throw "rustdesk.exe nao encontrado."
          }

          $size = (
              Get-Item $output
          ).Length

          if ($size -lt 1MB) {
              throw "Arquivo RustDesk parece invalido."
          }

          Write-Host ""
          Write-Host "Download concluido."
          Write-Host "Tamanho: $([math]::Round($size / 1MB,2)) MB"


      # ============================================================
      # 3. CRIAR SCRIPT DE CONFIGURACAO
      # ============================================================

      - name: Create Setup Script
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " CRIANDO CONFIGURADOR"
          Write-Host "========================================"

          @'
          import os
          import time
          import pyautogui as pag
          import pyperclip

          pag.FAILSAFE = False
          pag.PAUSE = 0.4

          password = os.environ.get(
              "RUSTDESK_PASSWORD",
              "Disalardp1"
          )

          print("=" * 50)
          print("CONFIGURANDO RUSTDESK")
          print("=" * 50)

          print("Aguardando interface...")
          time.sleep(5)


          # ---------------------------------------------------------
          # INSTALAR
          # ---------------------------------------------------------

          print("Install...")
          pag.click(
              109,
              451,
              duration=2
          )

          time.sleep(2)

          print("Confirmando Install...")
          pag.click(
              589,
              495,
              duration=2
          )

          time.sleep(2)

          print("OK...")
          pag.click(
              722,
              429,
              duration=1
          )

          time.sleep(3)


          # ---------------------------------------------------------
          # ABRIR CONFIGURACOES
          # ---------------------------------------------------------

          print("Abrindo menu...")
          pag.click(
              708,
              22,
              duration=2
          )

          time.sleep(2)

          print("Security...")
          pag.click(
              83,
              170,
              duration=2
          )

          time.sleep(2)


          # ---------------------------------------------------------
          # HABILITAR ACESSO
          # ---------------------------------------------------------

          print("Habilitando acesso...")
          pag.click(
              465,
              68,
              duration=2
          )

          time.sleep(2)

          print("Scroll...")
          pag.click(
              798,
              386,
              duration=2
          )

          time.sleep(2)


          # ---------------------------------------------------------
          # CONFIGURAR SENHA
          # ---------------------------------------------------------

          print("Set password...")
          pag.click(
              415,
              224,
              duration=2
          )

          time.sleep(2)


          # Senha
          pag.click(
              291,
              250,
              duration=1
          )

          pag.hotkey(
              "ctrl",
              "a"
          )

          pag.write(
              password,
              interval=0.03
          )


          # Confirmar senha
          pag.click(
              310,
              338,
              duration=1
          )

          pag.hotkey(
              "ctrl",
              "a"
          )

          pag.write(
              password,
              interval=0.03
          )

          time.sleep(1)


          # Confirmar
          pag.click(
              631,
              427,
              duration=2
          )

          time.sleep(3)


          # ---------------------------------------------------------
          # VOLTAR PARA HOME
          # ---------------------------------------------------------

          print("Voltando para tela principal...")

          pag.click(
              95,
              22,
              duration=2
          )

          time.sleep(5)


          # ---------------------------------------------------------
          # COPIAR ID
          # ---------------------------------------------------------

          print("Copiando ID...")

          # Mesmo metodo do script original.

          pag.rightClick(
              165,
              168,
              duration=1
          )

          time.sleep(1)

          pag.click(
              199,
              178,
              duration=1
          )

          time.sleep(1)

          pag.rightClick(
              138,
              167,
              duration=1
          )

          time.sleep(1)

          pag.click(
              163,
              182,
              duration=1
          )

          time.sleep(2)


          # ---------------------------------------------------------
          # LER CLIPBOARD
          # ---------------------------------------------------------

          rustdesk_id = pyperclip.paste().strip()

          print("")
          print("ID COPIADO:")
          print(rustdesk_id)
          print("")


          # ---------------------------------------------------------
          # SALVAR
          # ---------------------------------------------------------

          with open(
              r"C:\RustDesk\id.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  rustdesk_id
              )


          print("=" * 50)
          print("CONFIGURACAO FINALIZADA")
          print("=" * 50)

          '@ | Set-Content `
              "C:\RustDesk\setup.py" `
              -Encoding UTF8


      # ============================================================
      # 4. ABRIR RUSTDESK
      # ============================================================

      - name: Start RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " INICIANDO RUSTDESK"
          Write-Host "========================================"

          $rustdesk = "C:\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              throw "RustDesk nao encontrado."
          }

          Get-Process rustdesk `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Start-Process `
            -FilePath $rustdesk `
            -WorkingDirectory "C:\RustDesk"

          Write-Host ""
          Write-Host "Aguardando interface..."

          Start-Sleep -Seconds 10

          $process = Get-Process rustdesk `
            -ErrorAction SilentlyContinue

          if (!$process) {
              throw "RustDesk nao iniciou."
          }

          Write-Host ""
          Write-Host "RustDesk ativo:"
          Write-Host ""

          $process |
            Select-Object `
              Id,
              ProcessName,
              SessionId |
            Format-Table -AutoSize


      # ============================================================
      # 5. CONFIGURAR VIA GUI
      # ============================================================

      - name: Configure RustDesk
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CONFIGURANDO RUSTDESK"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace(
              $env:RUSTDESK_PASSWORD
          )) {

              throw "Secret RUSTDESK_PASSWORD nao configurado."
          }

          python C:\RustDesk\setup.py


      # ============================================================
      # 6. LER E CORRIGIR ID
      # ============================================================

      - name: Read RustDesk ID
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO ID"
          Write-Host "========================================"

          $file = "C:\RustDesk\id.txt"

          if (!(Test-Path $file)) {
              throw "Arquivo com ID nao foi criado."
          }

          $rawId = (
              Get-Content `
                $file `
                -Raw
          ).Trim()

          Write-Host ""
          Write-Host "ID copiado da interface:"
          Write-Host ""
          Write-Host "       $rawId"
          Write-Host ""


          # ========================================================
          # CORRECAO:
          #
          # 223 099 321
          #
          # vira:
          #
          # 223099321
          # ========================================================

          $id = $rawId -replace '[^0-9]', ''


          if (
              [string]::IsNullOrWhiteSpace($id)
          ) {

              throw "Nenhum numero encontrado no ID."

          }


          if ($id.Length -lt 6) {

              throw "ID muito curto: $id"

          }


          Write-Host "ID normalizado:"
          Write-Host ""
          Write-Host "       $id"
          Write-Host ""


          # Disponibiliza para os proximos steps.

          "RUSTDESK_ID=$id" >> $env:GITHUB_ENV

          "RUSTDESK_ID_FORMATTED=$rawId" >> $env:GITHUB_ENV


          Write-Host "========================================"
          Write-Host "       RUSTDESK PRONTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ID mostrado pelo RustDesk:"
          Write-Host ""
          Write-Host "       $rawId"
          Write-Host ""
          Write-Host "ID sem espacos:"
          Write-Host ""
          Write-Host "       $id"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 7. VERIFICAR INSTALACAO
      # ============================================================

      - name: Check RustDesk
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " DIAGNOSTICO RUSTDESK"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Processos:"
          Write-Host ""

          Get-Process rustdesk `
            -ErrorAction SilentlyContinue |
            Select-Object `
              Id,
              ProcessName,
              SessionId,
              StartTime |
            Format-Table -AutoSize


          Write-Host ""
          Write-Host "Servicos:"
          Write-Host ""

          Get-Service |
            Where-Object {

              $_.Name -like "*rustdesk*" -or
              $_.DisplayName -like "*rustdesk*"

            } |
            Format-Table `
              Name,
              DisplayName,
              Status,
              StartType `
              -AutoSize


          Write-Host ""
          Write-Host "Executavel instalado:"
          Write-Host ""

          if (
              Test-Path `
                "C:\Program Files\RustDesk\rustdesk.exe"
          ) {

              Write-Host "SIM"
              Write-Host ""
              Write-Host "C:\Program Files\RustDesk\rustdesk.exe"

          }
          else {

              Write-Host "NAO"

          }


      # ============================================================
      # 8. MOSTRAR DADOS
      # ============================================================

      - name: Mobile Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RUSTDESK MOBILE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ID mostrado na interface:"
          Write-Host ""
          Write-Host "       $env:RUSTDESK_ID_FORMATTED"
          Write-Host ""
          Write-Host "ID sem espacos:"
          Write-Host ""
          Write-Host "       $env:RUSTDESK_ID"
          Write-Host ""
          Write-Host "Senha:"
          Write-Host ""
          Write-Host "Use a senha definida no Secret"
          Write-Host "RUSTDESK_PASSWORD"
          Write-Host ""
          Write-Host "No Android/iPhone:"
          Write-Host ""
          Write-Host "1. Abra RustDesk"
          Write-Host "2. Digite o ID"
          Write-Host "3. Conecte"
          Write-Host "4. Digite sua senha"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 9. KEEP ALIVE
      # ============================================================

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS ONLINE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "RustDesk:"
          Write-Host "$env:RUSTDESK_ID_FORMATTED"
          Write-Host ""

          $start = Get-Date

          while ($true) {

              $process = Get-Process rustdesk `
                  -ErrorAction SilentlyContinue


              if (!$process) {

                  Write-Host ""
                  Write-Host "RustDesk parou."
                  Write-Host "Tentando reiniciar..."


                  $installed = `
                    "C:\Program Files\RustDesk\rustdesk.exe"


                  if (Test-Path $installed) {

                      Start-Process `
                        -FilePath $installed

                  }
                  else {

                      Start-Process `
                        -FilePath "C:\RustDesk\rustdesk.exe"

                  }


                  Start-Sleep -Seconds 10
              }


              $elapsed = (
                  Get-Date
              ) - $start


              Write-Host (
                  "RustDesk ONLINE | ID: {0} | Tempo: {1:hh\:mm\:ss}" -f `
                  $env:RUSTDESK_ID_FORMATTED,
                  $elapsed
              )


              Start-Sleep -Seconds 60
          }
