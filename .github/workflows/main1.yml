name: Windows - RustDesk Mobile

on:
  workflow_dispatch:

jobs:
  rustdesk:
    name: Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " Instalando RustDesk..."
          Write-Host "========================================"

          $installer = "$env:TEMP\rustdesk.exe"

          # Descobre a URL atual da versão x86_64
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" `
            -Headers @{
              "User-Agent" = "GitHub-Actions"
              "Accept" = "application/vnd.github+json"
            }

          $asset = $release.assets | Where-Object {
              $_.name -match 'x86_64\.exe$' -and
              $_.name -notmatch 'portable'
          } | Select-Object -First 1

          if (!$asset) {
              throw "Nao foi possivel localizar o instalador x86_64 do RustDesk."
          }

          Write-Host "Versao encontrada: $($release.tag_name)"
          Write-Host "Arquivo: $($asset.name)"
          Write-Host "Baixando..."

          # curl costuma ser mais confiavel no runner do que Invoke-WebRequest
          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            --connect-timeout 30 `
            -o $installer `
            $asset.browser_download_url

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao baixar RustDesk. curl exit code: $LASTEXITCODE"
          }

          if (!(Test-Path $installer)) {
              throw "O instalador nao foi criado."
          }

          $size = (Get-Item $installer).Length

          Write-Host "Download concluido."
          Write-Host "Tamanho: $([math]::Round($size / 1MB, 2)) MB"

          if ($size -lt 1MB) {
              throw "Arquivo baixado parece invalido."
          }

          Write-Host "Instalando..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--silent-install" `
            -Wait

          Start-Sleep -Seconds 10

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              throw "RustDesk nao foi encontrado em $rustdesk"
          }

          Write-Host "========================================"
          Write-Host " RustDesk instalado!"
          Write-Host " $rustdesk"
          Write-Host "========================================"

      - name: Configure RustDesk
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Write-Host "========================================"
          Write-Host " Configurando RustDesk"
          Write-Host "========================================"

          # Inicia serviço
          Start-Process `
            -FilePath $rustdesk `
            -ArgumentList "--install-service" `
            -Wait `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # Inicia RustDesk
          Start-Process $rustdesk

          Start-Sleep -Seconds 15

          # Configura senha permanente
          if ($env:RUSTDESK_PASSWORD) {

              Write-Host "Configurando senha..."

              & $rustdesk `
                --password $env:RUSTDESK_PASSWORD

          } else {

              Write-Host ""
              Write-Host "AVISO:"
              Write-Host "Secret RUSTDESK_PASSWORD nao configurado."
              Write-Host ""

          }

      - name: Get RustDesk ID
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Write-Host ""
          Write-Host "Aguardando ID do RustDesk..."

          $id = ""

          for ($i = 0; $i -lt 12; $i++) {

              try {
                  $id = (& $rustdesk --get-id).Trim()
              }
              catch {
                  $id = ""
              }

              if ($id) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RUSTDESK PRONTO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "ID:"
          Write-Host ""
          Write-Host "        $id"
          Write-Host ""
          Write-Host "Senha: configurada pelo GitHub Secret"
          Write-Host ""
          Write-Host "Abra o RustDesk no celular"
          Write-Host "e conecte usando o ID acima."
          Write-Host ""
          Write-Host "=========================================="

          "RUSTDESK_ID=$id" >> $env:GITHUB_ENV

      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " CONEXAO MOBILE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "RustDesk ID:"
          Write-Host "$env:RUSTDESK_ID"
          Write-Host ""
          Write-Host "Use a senha configurada no Secret:"
          Write-Host "RUSTDESK_PASSWORD"
          Write-Host ""
          Write-Host "Android/iPhone -> RustDesk"
          Write-Host "Digite o ID acima."
          Write-Host ""
          Write-Host "========================================"

      - name: Keep Windows Alive
        shell: powershell
        run: |
          Write-Host "Runner ativo."
          Write-Host "Tempo maximo do GitHub-hosted runner: 6 horas."
          Write-Host ""

          $start = Get-Date

          while ($true) {

              $elapsed = (Get-Date) - $start

              Write-Host ("RustDesk ativo | ID: {0} | Tempo: {1:hh\:mm\:ss}" -f `
                  $env:RUSTDESK_ID, $elapsed)

              Start-Sleep -Seconds 60
          }
