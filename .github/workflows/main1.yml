name: Windows - RDP Mobile

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURAR RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CONFIGURANDO RDP"
          Write-Host "========================================"

          # Habilitar Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Manter NLA habilitado
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # TLS / Negotiate
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Habilitar regras RDP
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 3

          $service = Get-Service TermService

          Write-Host ""
          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
              throw "Servico RDP nao iniciou."
          }

          Write-Host ""
          Write-Host "RDP habilitado."


      # ============================================================
      # 2. CRIAR USUARIO + SENHA
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CRIANDO USUARIO RDP"
          Write-Host "========================================"

          # Caracteres sem ambiguidades
          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"

          # Evita caracteres que podem causar confusao
          # ao digitar pelo celular.
          $special = "!@#"

          $chars = @()

          # Garantir complexidade
          $chars += $upper[(Get-Random -Maximum $upper.Length)]
          $chars += $upper[(Get-Random -Maximum $upper.Length)]

          $chars += $lower[(Get-Random -Maximum $lower.Length)]
          $chars += $lower[(Get-Random -Maximum $lower.Length)]

          $chars += $numbers[(Get-Random -Maximum $numbers.Length)]
          $chars += $numbers[(Get-Random -Maximum $numbers.Length)]

          $chars += $special[(Get-Random -Maximum $special.Length)]

          $all = $upper + $lower + $numbers

          # Total: 16 caracteres
          while ($chars.Count -lt 16) {
              $chars += $all[(Get-Random -Maximum $all.Length)]
          }

          # Embaralhar
          $password = -join (
              $chars |
              Sort-Object {
                  Get-Random
              }
          )

          Write-Host ""
          Write-Host "Senha gerada."

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force


          # --------------------------------------------------------
          # CRIAR/ATUALIZAR CONTA
          # --------------------------------------------------------

          $existing = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "Conta RDP existente. Atualizando senha..."

              Set-LocalUser `
                  -Name "RDP" `
                  -Password $securePassword

          }
          else {

              Write-Host "Criando conta RDP..."

              New-LocalUser `
                  -Name "RDP" `
                  -Password $securePassword `
                  -AccountNeverExpires `
                  -PasswordNeverExpires `
                  -Description "Remote Desktop User"
          }


          # --------------------------------------------------------
          # GARANTIR CONTA ATIVA
          # --------------------------------------------------------

          Enable-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue


          # --------------------------------------------------------
          # GRUPOS
          # --------------------------------------------------------

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP" `
              -ErrorAction SilentlyContinue


          # --------------------------------------------------------
          # VERIFICAR CONTA
          # --------------------------------------------------------

          $user = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction Stop

          if (!$user.Enabled) {
              throw "Conta RDP esta desabilitada."
          }

          Write-Host ""
          Write-Host "Conta:"
          Write-Host $user.Name

          Write-Host "Ativa:"
          Write-Host $user.Enabled


          # --------------------------------------------------------
          # SALVAR PARA OS PROXIMOS STEPS
          # --------------------------------------------------------

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV


          # --------------------------------------------------------
          # MOSTRAR CREDENCIAIS
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host " CREDENCIAIS GERADAS"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Usuario:"
          Write-Host ""
          Write-Host '       .\RDP'
          Write-Host ""
          Write-Host "Senha:"
          Write-Host ""
          Write-Host "       $password"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 3. VERIFICAR GRUPOS
      # ============================================================
      - name: Verify RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " VERIFICANDO CONTA"
          Write-Host "========================================"

          $user = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction Stop

          Write-Host ""
          Write-Host "Nome: $($user.Name)"
          Write-Host "Enabled: $($user.Enabled)"
          Write-Host "PasswordExpires: $($user.PasswordExpires)"
          Write-Host ""

          Write-Host "Remote Desktop Users:"
          Write-Host ""

          Get-LocalGroupMember `
              -Group "Remote Desktop Users" |
              Format-Table Name,ObjectClass -AutoSize

          Write-Host ""
          Write-Host "Administrators:"
          Write-Host ""

          Get-LocalGroupMember `
              -Group "Administrators" |
              Where-Object {
                  $_.Name -match 'RDP$'
              } |
              Format-Table Name,ObjectClass -AutoSize


      # ============================================================
      # 4. INSTALAR TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " INSTALANDO TAILSCALE"
          Write-Host "========================================"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = Join-Path `
              $env:TEMP `
              "tailscale.msi"

          Write-Host ""
          Write-Host "Baixando..."

          & curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 3 `
              --connect-timeout 30 `
              -o "$installer" `
              "$url"

          if ($LASTEXITCODE -ne 0) {
              throw "Falha no download do Tailscale."
          }

          if (!(Test-Path $installer)) {
              throw "Instalador Tailscale nao encontrado."
          }

          Write-Host ""
          Write-Host "Instalando..."

          $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @(
                  "/i"
                  "`"$installer`""
                  "/quiet"
                  "/norestart"
              ) `
              -Wait `
              -PassThru

          if (
              $process.ExitCode -ne 0 -and
              $process.ExitCode -ne 3010
          ) {
              throw "Instalacao Tailscale falhou: $($process.ExitCode)"
          }

          Remove-Item `
              $installer `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Tailscale instalado."


      # ============================================================
      # 5. LOCALIZAR TAILSCALE
      # ============================================================
      - name: Detect Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " LOCALIZANDO TAILSCALE"
          Write-Host "========================================"

          $tailscale = Join-Path `
              $env:ProgramFiles `
              "Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {

              $x86 = ${env:ProgramFiles(x86)}

              if ($x86) {

                  $alternative = Join-Path `
                      $x86 `
                      "Tailscale\tailscale.exe"

                  if (Test-Path $alternative) {
                      $tailscale = $alternative
                  }
              }
          }

          if (!(Test-Path $tailscale)) {
              throw "tailscale.exe nao encontrado."
          }

          Write-Host ""
          Write-Host "Encontrado:"
          Write-Host $tailscale

          "TAILSCALE_EXE=$tailscale" >> $env:GITHUB_ENV


      # ============================================================
      # 6. CONECTAR TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CONECTANDO TAILSCALE"
          Write-Host "========================================"

          if (
              [string]::IsNullOrWhiteSpace(
                  $env:TAILSCALE_AUTH_KEY
              )
          ) {
              throw "TAILSCALE_AUTH_KEY nao configurado."
          }

          $tailscale = $env:TAILSCALE_EXE


          # --------------------------------------------------------
          # SERVICO
          # --------------------------------------------------------

          $service = Get-Service `
              -Name "Tailscale" `
              -ErrorAction SilentlyContinue

          if (!$service) {
              throw "Servico Tailscale nao encontrado."
          }

          if ($service.Status -ne "Running") {

              Start-Service `
                  -Name "Tailscale"

              Start-Sleep -Seconds 5
          }


          # --------------------------------------------------------
          # CONECTAR
          # --------------------------------------------------------

          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          Write-Host ""
          Write-Host "Hostname:"
          Write-Host $hostname

          & $tailscale up `
              --authkey="$env:TAILSCALE_AUTH_KEY" `
              --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "tailscale up falhou."
          }


          # --------------------------------------------------------
          # PEGAR IP
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Aguardando IPv4..."

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              Write-Host "Tentativa $i/20..."

              try {

                  $result = (
                      & $tailscale ip -4 |
                      Out-String
                  ).Trim()

                  $candidate = (
                      $result -split "`r?`n" |
                      Select-Object -First 1
                  ).Trim()

                  if (
                      $candidate -match '^100\.\d+\.\d+\.\d+$'
                  ) {

                      $tsIP = $candidate
                      break
                  }

              }
              catch {}

              Start-Sleep -Seconds 3
          }

          if (!$tsIP) {
              throw "Tailscale nao forneceu IPv4."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "========================================"
          Write-Host " TAILSCALE CONECTADO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "IP:"
          Write-Host ""
          Write-Host "       $tsIP"
          Write-Host ""


      # ============================================================
      # 7. FIREWALL
      # ============================================================
      - name: Secure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CONFIGURANDO FIREWALL"
          Write-Host "========================================"

          # Remover nossa regra anterior
          Remove-NetFirewallRule `
              -DisplayName "RDP via Tailscale" `
              -ErrorAction SilentlyContinue

          # Permitir somente rede Tailscale
          New-NetFirewallRule `
              -DisplayName "RDP via Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress "100.64.0.0/10"

          Write-Host ""
          Write-Host "Firewall configurado."


      # ============================================================
      # 8. VERIFICAR RDP
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " TESTANDO RDP"
          Write-Host "========================================"

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {

              Start-Service TermService

              Start-Sleep -Seconds 3
          }

          $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if (!$listener) {
              throw "Porta 3389 nao esta em LISTEN."
          }

          Write-Host ""
          Write-Host "Porta 3389: LISTEN"


          # --------------------------------------------------------
          # TESTAR IP TAILSCALE
          # --------------------------------------------------------

          $test = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "TCP 3389:"
          Write-Host $test.TcpTestSucceeded

          if (!$test.TcpTestSucceeded) {
              throw "RDP nao respondeu pela interface Tailscale."
          }

          Write-Host ""
          Write-Host "RDP acessivel."


      # ============================================================
      # 9. DADOS DE CONEXAO
      # ============================================================
      - name: Show Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP PRONTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ENDERECO:"
          Write-Host ""
          Write-Host "       $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "USUARIO:"
          Write-Host ""
          Write-Host '       .\RDP'
          Write-Host ""
          Write-Host "SENHA:"
          Write-Host ""
          Write-Host "       $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""
          Write-Host "NO CELULAR:"
          Write-Host ""
          Write-Host "PC:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username:"
          Write-Host '.\RDP'
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 10. KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS ONLINE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host 'Usuario: .\RDP'
          Write-Host ""

          $start = Get-Date

          while ($true) {

              $elapsed = (
                  Get-Date
              ) - $start

              $rdp = Get-Service `
                  TermService `
                  -ErrorAction SilentlyContinue

              if (
                  $rdp -and
                  $rdp.Status -ne "Running"
              ) {

                  Write-Host "TermService parou. Reiniciando..."

                  Start-Service `
                      TermService `
                      -ErrorAction SilentlyContinue
              }

              Write-Host (
                  "[{0}] RDP ONLINE | {1} | {2:hh\:mm\:ss}" -f `
                  (Get-Date -Format "HH:mm:ss"),
                  $env:TAILSCALE_IP,
                  $elapsed
              )

              Start-Sleep -Seconds 300
          }
