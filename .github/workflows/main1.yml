name: Windows - RustDesk Mobile

on:
  workflow_dispatch:

jobs:
  rustdesk:
    name: Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare Environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " PREPARANDO WINDOWS"
          Write-Host "========================================"

          python -m pip install --upgrade pip
          pip install pyautogui pyperclip psutil --quiet

          New-Item `
            -ItemType Directory `
            -Path "C:\RustDesk" `
            -Force | Out-Null


      - name: Download RustDesk 1.2.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " BAIXANDO RUSTDESK 1.2.1"
          Write-Host "========================================"

          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"

          $output = "C:\RustDesk\rustdesk.exe"

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            -o $output `
            $url

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao baixar RustDesk."
          }

          if (!(Test-Path $output)) {
              throw "rustdesk.exe nao encontrado."
          }

          $size = (Get-Item $output).Length

          Write-Host ""
          Write-Host "Download concluido."
          Write-Host "Tamanho: $([math]::Round($size / 1MB,2)) MB"


      - name: Create RustDesk Setup Script
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          @'
          import os
          import time
          import pyautogui as pag
          import pyperclip

          password = os.environ.get(
              "RUSTDESK_PASSWORD",
              "Disalardp1"
          )

          print("Aguardando RustDesk...")
          time.sleep(5)

          actions = [
              (109, 451, 2),  # Install
              (589, 495, 2),  # Install novamente
              (722, 429, 1),  # OK

              (708, 22, 7),   # Menu
              (83, 170, 2),   # Security
              (465, 68, 2),   # Enable

              (798, 386, 2),  # Scroll
              (415, 224, 2),  # Set password

              (291, 250, 2),  # Password
              (310, 338, 2),  # Confirmacao

              (631, 427, 2),  # OK

              (95, 22, 2),    # Voltar para tela principal
          ]

          for x, y, duration in actions:

              print("Click:", x, y)

              pag.click(
                  x,
                  y,
                  duration=duration
              )

              time.sleep(0.5)

              if (x, y) in [
                  (291, 250),
                  (310, 338)
              ]:

                  pag.hotkey("ctrl", "a")

                  pag.write(
                      password,
                      interval=0.03
                  )

          print("Configuracao concluida.")

          time.sleep(5)

          # Copia o ID da interface.
          pag.rightClick(
              165,
              168,
              duration=1
          )

          time.sleep(1)

          pag.click(
              199,
              178,
              duration=1
          )

          time.sleep(1)

          pag.rightClick(
              138,
              167,
              duration=1
          )

          time.sleep(1)

          pag.click(
              163,
              182,
              duration=1
          )

          time.sleep(2)

          rustdesk_id = pyperclip.paste().strip()

          print(
              "Clipboard:",
              rustdesk_id
          )

          with open(
              r"C:\RustDesk\id.txt",
              "w"
          ) as f:

              f.write(rustdesk_id)

          print("FINALIZADO")
          '@ | Set-Content `
                "C:\RustDesk\setup.py" `
                -Encoding UTF8


      - name: Start RustDesk
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " INICIANDO RUSTDESK"
          Write-Host "========================================"

          Start-Process `
            -FilePath "C:\RustDesk\rustdesk.exe"

          Write-Host "RustDesk iniciado."

          Start-Sleep -Seconds 10

          Get-Process rustdesk `
            -ErrorAction SilentlyContinue |
            Format-Table `
              Id,
              ProcessName,
              SessionId `
              -AutoSize


      - name: Configure RustDesk GUI
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          Write-Host "========================================"
          Write-Host " CONFIGURANDO RUSTDESK"
          Write-Host "========================================"

          python C:\RustDesk\setup.py


      - name: Read RustDesk ID
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO ID"
          Write-Host "========================================"

          if (!(Test-Path "C:\RustDesk\id.txt")) {
              throw "Arquivo com ID nao foi criado."
          }

          $id = (
              Get-Content `
                "C:\RustDesk\id.txt" `
                -Raw
          ).Trim()

          Write-Host ""
          Write-Host "Valor copiado:"
          Write-Host "[$id]"
          Write-Host ""

          if ($id -match '([0-9]{6,})') {

              $id = $Matches[1]

          } else {

              throw "O valor copiado nao parece ser um ID RustDesk."
          }

          "RUSTDESK_ID=$id" >> $env:GITHUB_ENV

          Write-Host "========================================"
          Write-Host "       RUSTDESK PRONTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ID:"
          Write-Host ""
          Write-Host "       $id"
          Write-Host ""
          Write-Host "========================================"


      - name: Show Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "     CONECTAR PELO CELULAR"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "RustDesk ID:"
          Write-Host ""
          Write-Host "       $env:RUSTDESK_ID"
          Write-Host ""
          Write-Host "Senha:"
          Write-Host "Use RUSTDESK_PASSWORD"
          Write-Host ""
          Write-Host "Abra RustDesk no Android/iPhone"
          Write-Host "e coloque o ID acima."
          Write-Host ""
          Write-Host "========================================"


      - name: Keep Alive
        shell: powershell
        run: |
          $start = Get-Date

          while ($true) {

              $rustdesk = Get-Process rustdesk `
                  -ErrorAction SilentlyContinue

              if (!$rustdesk) {

                  Write-Host "RustDesk parou. Reiniciando..."

                  Start-Process `
                    "C:\Program Files\RustDesk\rustdesk.exe" `
                    -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 10

              }

              $elapsed = (Get-Date) - $start

              Write-Host (
                  "ONLINE | RustDesk: {0} | Tempo: {1:hh\:mm\:ss}" -f `
                  $env:RUSTDESK_ID,
                  $elapsed
              )

              Start-Sleep -Seconds 60
          }
